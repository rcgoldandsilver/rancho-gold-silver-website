backend:
  name: github
  repo: rcgoldandsilver/rancho-gold-silver-website
  branch: main
  base_url: https://rancho-gold-admin-auth.rcgoldandsilverllc.workers.dev

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

media_processing:
  enabled: true

collections:

  - name: "site"
    label: "Website Content"

    files:

      - name: "general"
        label: "General Information"
        file: "content/settings/general.json"
        format: "json"

        fields:

          # ==================================
          # GENERAL
          # ==================================

          - label: "Homepage Intro"
            name: "homepage_intro"
            widget: "text"
            default: "Rancho Cucamonga Gold & Silver and San Bernardino Gold & Silver are family-owned precious-metals dealers buying and selling gold, silver, coins, bars and bullion with professional testing and straightforward service."

          - label: "Rancho Phone"
            name: "rancho_phone"
            widget: "string"

          - label: "San Bernardino Phone"
            name: "sb_phone"
            widget: "string"

          - label: "Rancho Address"
            name: "rancho_address"
            widget: "string"

          - label: "San Bernardino Address"
            name: "sb_address"
            widget: "string"


          # ==================================
          # HEADER
          # ==================================

          - label: "Header Logo"
            name: "header_logo"
            widget: "image"
            required: false


          # ==================================
          # HOMEPAGE
          # ==================================

          - label: "Homepage Hero Image"
            name: "hero_image"
            widget: "image"
            required: false

          - label: "Homepage Main Heading"
            name: "homepage_heading"
            widget: "string"
            default: "Your Local Gold & Silver Dealer"

          - label: "Homepage Free Appraisal Line"
            name: "homepage_appraisal_text"
            widget: "string"
            default: "Free Appraisals • No Obligation to Sell"

          - label: "Homepage Trust Label 1"
            name: "homepage_trust_1"
            widget: "string"
            default: "Three Generations of Experience"

          - label: "Homepage Trust Label 2"
            name: "homepage_trust_2"
            widget: "string"
            default: "Family-Owned"

          - label: "Homepage Trust Label 3"
            name: "homepage_trust_3"
            widget: "string"
            default: "Testing in Front of You"

          - label: "Homepage Trust Label 4"
            name: "homepage_trust_4"
            widget: "string"
            default: "Immediate Payment"

          - label: "Homepage WE BUY Photo"
            name: "homepage_buy_image"
            widget: "image"
            required: false

          - label: "Homepage WE BUY Heading"
            name: "homepage_buy_heading"
            widget: "string"
            default: "WE BUY"

          - label: "Homepage WE BUY Description"
            name: "homepage_buy_description"
            widget: "text"
            default: "Jewelry, Coins, Bars, Silverware, Dental Gold & Scrap"

          - label: "Homepage WE SELL Photo"
            name: "homepage_sell_image"
            widget: "image"
            required: false

          - label: "Homepage WE SELL Heading"
            name: "homepage_sell_heading"
            widget: "string"
            default: "WE SELL"

          - label: "Homepage WE SELL Description"
            name: "homepage_sell_description"
            widget: "text"
            default: "Gold & Silver Coins, Bars & Bullion"

          - label: "Homepage XRF Heading"
            name: "homepage_xrf_heading"
            widget: "string"
            default: "XRF Testing"

          - label: "Homepage Melting Heading"
            name: "homepage_melting_heading"
            widget: "string"
            default: "In-House Assay & Melting"


          # ==================================
          # HOMEPAGE REVIEWS
          # ==================================

          - label: "Homepage Reviews Heading"
            name: "homepage_reviews_heading"
            widget: "string"
            default: "Customer Reviews"

          - label: "Homepage Review 1 Name"
            name: "homepage_review_1_name"
            widget: "string"
            default: "Google Customer"

          - label: "Homepage Review 1"
            name: "homepage_review_1_text"
            widget: "text"
            default: "Professional, transparent service and testing right in front of you."

          - label: "Homepage Review 2 Name"
            name: "homepage_review_2_name"
            widget: "string"
            default: "Google Customer"

          - label: "Homepage Review 2"
            name: "homepage_review_2_text"
            widget: "text"
            default: "Knowledgeable, friendly and straightforward experience."

          - label: "Homepage Review 3 Name"
            name: "homepage_review_3_name"
            widget: "string"
            default: "Google Customer"

          - label: "Homepage Review 3"
            name: "homepage_review_3_text"
            widget: "text"
            default: "Fair evaluation and an easy transaction from start to finish."

          - label: "Homepage Review 4 Name"
            name: "homepage_review_4_name"
            widget: "string"
            default: "Google Customer"

          - label: "Homepage Review 4"
            name: "homepage_review_4_text"
            widget: "text"
            default: "Clean shop, professional testing and excellent customer service."


          # ==================================
          # HOMEPAGE FAQ
          # ==================================

          - label: "Homepage FAQ Heading"
            name: "homepage_faq_heading"
            widget: "string"
            default: "Frequently Asked Questions"

          - label: "FAQ 1 - Question"
            name: "homepage_faq_1_question"
            widget: "string"
            default: "Do I need an appointment?"

          - label: "FAQ 1 - Answer"
            name: "homepage_faq_1_answer"
            widget: "text"
            default: "No. Walk-ins are welcome at both locations."

          - label: "FAQ 2 - Question"
            name: "homepage_faq_2_question"
            widget: "string"
            default: "Are appraisals free?"

          - label: "FAQ 2 - Answer"
            name: "homepage_faq_2_answer"
            widget: "text"
            default: "Yes. Appraisals are free and there is no obligation to sell."

          - label: "FAQ 3 - Question"
            name: "homepage_faq_3_question"
            widget: "string"
            default: "How do you test gold and silver?"

          - label: "FAQ 3 - Answer"
            name: "homepage_faq_3_answer"
            widget: "text"
            default: "We use professional methods including XRF, Sigma verification and traditional testing when appropriate."

          - label: "FAQ 4 - Question"
            name: "homepage_faq_4_question"
            widget: "string"
            default: "Do you buy broken jewelry, silverware, and dental gold?"

          - label: "FAQ 4 - Answer"
            name: "homepage_faq_4_answer"
            widget: "text"
            default: "Yes. We buy many forms of precious metals, including broken items and scrap."

          - label: "FAQ 5 - Question"
            name: "homepage_faq_5_question"
            widget: "string"
            default: "How do I get paid when I sell?"

          - label: "FAQ 5 - Answer"
            name: "homepage_faq_5_answer"
            widget: "text"
            default: "When you accept our offer, payment is immediate. Available methods include cash, business check, Zelle and wire transfer."


          # ==================================
          # WHAT WE BUY
          # ==================================

          - label: "What We Buy - Page Heading"
            name: "buy_page_heading"
            widget: "string"
            default: "What We Buy"

          - label: "What We Buy - Page Intro"
            name: "buy_page_intro"
            widget: "text"
            default: "Bring your precious metals to either location for professional testing and a clear offer."


          # GOLD JEWELRY

          - label: "Gold Jewelry - Photo"
            name: "buy_gold_jewelry_image"
            widget: "image"
            required: false

          - label: "Gold Jewelry - Heading"
            name: "buy_gold_jewelry_heading"
            widget: "string"
            default: "Gold Jewelry"

          - label: "Gold Jewelry - Description"
            name: "buy_gold_jewelry_description"
            widget: "text"
            default: "8K, 9K, 10K, 14K, 18K, 21K, 22K and 24K solid gold; yellow, white and rose gold; broken or unwanted jewelry."


          # GOLD & SILVER COINS

          - label: "Gold & Silver Coins - Photo"
            name: "buy_coins_image"
            widget: "image"
            required: false

          - label: "Gold & Silver Coins - Heading"
            name: "buy_coins_heading"
            widget: "string"
            default: "Gold & Silver Coins"

          - label: "Gold & Silver Coins - Description"
            name: "buy_coins_description"
            widget: "text"
            default: "American Eagles, Buffalos, Maple Leafs, Krugerrands, Mexican gold, Silver Eagles, Morgan and Peace dollars, constitutional silver and world bullion coins."


          # BARS & BULLION

          - label: "Bars & Bullion - Photo"
            name: "buy_bullion_image"
            widget: "image"
            required: false

          - label: "Bars & Bullion - Heading"
            name: "buy_bullion_heading"
            widget: "string"
            default: "Bars & Bullion"

          - label: "Bars & Bullion - Description"
            name: "buy_bullion_description"
            widget: "text"
            default: "Gold and silver bars, rounds and bullion in recognized or unbranded forms, various sizes and weights."


          # STERLING SILVER & SILVERWARE

          - label: "Sterling Silver & Silverware - Photo"
            name: "buy_silverware_image"
            widget: "image"
            required: false

          - label: "Sterling Silver & Silverware - Heading"
            name: "buy_silverware_heading"
            widget: "string"
            default: "Sterling Silver & Silverware"

          - label: "Sterling Silver & Silverware - Description"
            name: "buy_silverware_description"
            widget: "text"
            default: "Sterling and other real silver including .925 and .800; flatware, tea sets, trays, bowls and household silver."


          # DENTAL GOLD

          - label: "Dental Gold - Photo"
            name: "buy_dental_image"
            widget: "image"
            required: false

          - label: "Dental Gold - Heading"
            name: "buy_dental_heading"
            widget: "string"
            default: "Dental Gold"

          - label: "Dental Gold - Description"
            name: "buy_dental_description"
            widget: "text"
            default: "Dental gold, crowns, bridges and other precious-metal dental material."


          # SCRAP GOLD & SILVER

          - label: "Scrap Gold & Silver - Photo"
            name: "buy_scrap_image"
            widget: "image"
            required: false

          - label: "Scrap Gold & Silver - Heading"
            name: "buy_scrap_heading"
            widget: "string"
            default: "Scrap Gold & Silver"

          - label: "Scrap Gold & Silver - Description"
            name: "buy_scrap_description"
            widget: "text"
            default: "Broken jewelry, clippings, filings, casting scrap, melted pieces, nuggets and other testable precious-metal scrap."


          # OTHER PRECIOUS METALS

          - label: "Other Precious Metals - Photo"
            name: "buy_other_metals_image"
            widget: "image"
            required: false

          - label: "Other Precious Metals - Heading"
            name: "buy_other_metals_heading"
            widget: "string"
            default: "Other Precious Metals"

          - label: "Other Precious Metals - Description"
            name: "buy_other_metals_description"
            widget: "text"
            default: "Platinum, palladium and rhodium items can be evaluated when appropriate."


          # SELLING PROCESS

          - label: "Selling Process - Heading"
            name: "buy_process_heading"
            widget: "string"
            default: "Simple Selling Process"

          - label: "Selling Process - Step 1"
            name: "buy_process_step_1"
            widget: "string"
            default: "1. Bring Your Items"

          - label: "Selling Process - Step 2"
            name: "buy_process_step_2"
            widget: "string"
            default: "2. We Test & Weigh"

          - label: "Selling Process - Step 3"
            name: "buy_process_step_3"
            widget: "string"
            default: "3. Receive Our Offer"

          - label: "Selling Process - Step 4"
            name: "buy_process_step_4"
            widget: "string"
            default: "4. Immediate Payment"

          - label: "Selling Process - Payment Methods"
            name: "buy_payment_methods"
            widget: "string"
            default: "Cash • Business Check • Zelle • Wire Transfer"


          # ==================================
          # TESTING & VERIFICATION
          # ==================================

          - label: "XRF Testing Photo"
            name: "xrf_image"
            widget: "image"
            required: false

          - label: "XRF Text"
            name: "xrf_text"
            widget: "text"

          - label: "XRF Video"
            name: "xrf_video"
            widget: "file"
            required: false

          - label: "Sigma Metalytics Photo"
            name: "sigma_image"
            widget: "image"
            required: false

          - label: "Traditional Acid Testing Photo"
            name: "acid_image"
            widget: "image"
            required: false

          - label: "Assay & Melting Photo"
            name: "melting_image"
            widget: "image"
            required: false

          - label: "Melting Text"
            name: "melting_text"
            widget: "text"

          - label: "Melting Video"
            name: "melting_video"
            widget: "file"
            required: false


          # ==================================
          # ABOUT US
          # ==================================

          - label: "About Us - Intro"
            name: "about_intro"
            widget: "text"
            default: "Family-owned. Three generations of precious-metals experience."

          - label: "About Us - Main Heading"
            name: "about_heading"
            widget: "string"
            default: "A Straightforward Way to Buy & Sell Precious Metals"

          - label: "About Us - First Description"
            name: "about_description_1"
            widget: "text"
            default: "Our family brings three generations of precious-metals knowledge to Rancho Cucamonga and San Bernardino. We focus on efficient local offices, professional testing and clear evaluations without commissioned salespeople pushing customers."

          - label: "About Us - Second Description"
            name: "about_description_2"
            widget: "text"
            default: "Items are tested and weighed in front of you whenever practical. For appropriate larger lots, our in-house precious metal assay and melting process can help create a consistent sample before an offer."

          - label: "About Us - Trust Label 1"
            name: "about_trust_1"
            widget: "string"
            default: "Three Generations"

          - label: "About Us - Trust Label 2"
            name: "about_trust_2"
            widget: "string"
            default: "Family-Owned"

          - label: "About Us - Trust Label 3"
            name: "about_trust_3"
            widget: "string"
            default: "Transparent Testing"

          - label: "About Us - Trust Label 4"
            name: "about_trust_4"
            widget: "string"
            default: "Competitive Offers"

          - label: "About Us - Photo 1"
            name: "about_image_1"
            widget: "image"
            required: false

          - label: "About Us - Photo 2"
            name: "about_image_2"
            widget: "image"
            required: false


          # ==================================
          # LOCATIONS PAGE
          # ==================================

          - label: "Locations - Page Heading"
            name: "locations_heading"
            widget: "string"
            default: "Our Locations"

          - label: "Locations - Intro"
            name: "locations_intro"
            widget: "text"
            default: "Walk-ins welcome. No appointment needed."

          - label: "Rancho Location - Name"
            name: "rancho_location_name"
            widget: "string"
            default: "Rancho Cucamonga Gold & Silver"

          - label: "Rancho Location - View Button"
            name: "rancho_location_button"
            widget: "string"
            default: "View Location"

          - label: "San Bernardino Location - Name"
            name: "sb_location_name"
            widget: "string"
            default: "San Bernardino Gold & Silver"

          - label: "San Bernardino Location - View Button"
            name: "sb_location_button"
            widget: "string"
            default: "View Location"


          # ==================================
          # RANCHO CUCAMONGA LOCATION PAGE
          # ==================================

          - label: "Rancho Page - Heading"
            name: "rancho_page_heading"
            widget: "string"
            default: "Rancho Cucamonga Gold & Silver"

          - label: "Rancho Page - Intro"
            name: "rancho_page_intro"
            widget: "text"
            default: "Buy Gold & Silver • Sell Gold & Silver • Free Appraisals • Professional Testing"

          - label: "Rancho Page - Visit Us Heading"
            name: "rancho_visit_heading"
            widget: "string"
            default: "Visit Us"

          - label: "Rancho Page - Gallery Heading"
            name: "rancho_gallery_heading"
            widget: "string"
            default: "Store Gallery"

          - label: "Rancho Page - Gallery Photo 1"
            name: "rancho_gallery_image_1"
            widget: "image"
            required: false

          - label: "Rancho Page - Gallery Photo 2"
            name: "rancho_gallery_image_2"
            widget: "image"
            required: false

          - label: "Rancho Page - Gallery Photo 3"
            name: "rancho_gallery_image_3"
            widget: "image"
            required: false

          - label: "Rancho Page - Gallery Photo 4"
            name: "rancho_gallery_image_4"
            widget: "image"
            required: false

          - label: "Rancho Page - Gallery Note"
            name: "rancho_gallery_note"
            widget: "text"
            required: false
            default: "Location gallery placeholders will be replaced with the final 4–6 photos you provide."


          # ==================================
          # SAN BERNARDINO LOCATION PAGE
          # ==================================

          - label: "San Bernardino Page - Heading"
            name: "sb_page_heading"
            widget: "string"
            default: "San Bernardino Gold & Silver"

          - label: "San Bernardino Page - Intro"
            name: "sb_page_intro"
            widget: "text"
            default: "Buy Gold & Silver • Sell Gold & Silver • Free Appraisals • Professional Testing"

          - label: "San Bernardino Page - Visit Us Heading"
            name: "sb_visit_heading"
            widget: "string"
            default: "Visit Us"

          - label: "San Bernardino Page - Gallery Heading"
            name: "sb_gallery_heading"
            widget: "string"
            default: "Store Gallery"

          - label: "San Bernardino Page - Gallery Photo 1"
            name: "sb_gallery_image_1"
            widget: "image"
            required: false

          - label: "San Bernardino Page - Gallery Photo 2"
            name: "sb_gallery_image_2"
            widget: "image"
            required: false

          - label: "San Bernardino Page - Gallery Photo 3"
            name: "sb_gallery_image_3"
            widget: "image"
            required: false

          - label: "San Bernardino Page - Gallery Photo 4"
            name: "sb_gallery_image_4"
            widget: "image"
            required: false

          - label: "San Bernardino Page - Gallery Note"
            name: "sb_gallery_note"
            widget: "text"
            required: false
            default: "Location gallery placeholders will be replaced with the final 4–6 photos you provide."


  # ==================================
  # PRODUCTS / WHAT WE SELL
  # ==================================

  - name: "products"
    label: "Products"
    label_singular: "Product"

    folder: "content/products"

    create: true
    delete: true

    extension: "json"
    format: "json"

    identifier_field: "name"

    slug: "{{slug}}"

    summary: "{{name}} — {{category}}"

    fields:

      - label: "Show on Website"
        name: "visible"
        widget: "boolean"
        default: true

      - label: "Product Name"
        name: "name"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Gold Coins"
          - "Gold Bars"
          - "Silver Coins & Rounds"
          - "Silver Bars"

      - label: "Main Photo"
        name: "image"
        widget: "image"

      - label: "Second Photo"
        name: "image2"
        widget: "image"
        required: false

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Weight"
        name: "weight"
        widget: "string"
        required: false

      - label: "Purity"
        name: "purity"
        widget: "string"
        required: false

      - label: "Precious Metal Content"
        name: "metal_content"
        widget: "string"
        required: false

      - label: "Mint / Country"
        name: "mint_country"
        widget: "string"
        required: false

      - label: "Available Sizes"
        name: "sizes"
        widget: "string"
        required: false

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 100
